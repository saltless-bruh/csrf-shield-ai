<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CSRF Shield AI Web Dashboard</title>
</head>
<body>
    <h1>CSRF Shield AI</h1>
    <p>Upload a .HAR file to begin analysis.</p>

    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <ul class=flashes>
        {% for message in messages %}
          <li>{{ message }}</li>
        {% endfor %}
        </ul>
      {% endif %}
    {% endwith %}

    <form method="POST" action="/" enctype="multipart/form-data">
        <input type="file" name="har_file" accept=".har" required>
        <button type="submit">Analyze HAR Session</button>
    </form>
</body>
</html>
